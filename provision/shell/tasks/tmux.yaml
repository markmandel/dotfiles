---
- name: tmux
  become: true
  apt:
    name:
    - tmux
    - urlview
    - fzf
    - fd-find
    - bat
- name: symlink tmux config
  file: src={{ role_path }}/files/tmux.conf path=~/.tmux.conf state=link force=yes
- name: "Create .tmux plugins dir"
  file: path="~/.tmux/plugins" state=directory
- name: clone tmux plugin manager
  git: repo=https://github.com/tmux-plugins/tpm dest=~/.tmux/plugins/tpm

# tmux-file-picker is a standalone script, not a tpm plugin - it installs onto PATH.
# fzf and fd (fdfind on Debian) above are hard requirements; bat is for previews.
- name: "Create ~/.local/bin"
  file:
    path: ~/.local/bin
    state: directory
    mode: '0755'

- name: install or update tmux-file-picker
  get_url:
    url: https://raw.githubusercontent.com/raine/tmux-file-picker/main/tmux-file-picker
    dest: ~/.local/bin/tmux-file-picker
    force: true
    mode: '0755'
  retries: 5
  delay: 5
