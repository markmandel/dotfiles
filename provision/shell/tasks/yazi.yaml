# Source: https://yazi-rs.github.io/docs/installation#apt
---
- name: Add yazi APT signing key
  become: true
  get_url:
    url: https://yazi-rs.github.io/builds/yazi-keyring.gpg
    dest: /usr/share/keyrings/yazi-keyring.gpg
    mode: '0644'
  retries: 5
  delay: 5

- name: Add yazi APT repository
  become: true
  copy:
    dest: /etc/apt/sources.list.d/yazi.list
    content: "deb [signed-by=/usr/share/keyrings/yazi-keyring.gpg] https://yazi-rs.github.io/builds/ stable main\n"
    mode: '0644'

- name: Install yazi
  become: true
  apt:
    name: yazi
    update_cache: true

# Optional dependencies: https://yazi-rs.github.io/docs/installation
# fzf and fd-find come from tmux.yaml, wl-clipboard and the nerd font from the
# ui role, and 7-zip (p7zip-full), jq and zoxide from std_packages.yaml.
- name: Install yazi dependencies
  become: true
  apt:
    name:
      - file
      - ffmpeg
      - poppler-utils
      - ripgrep
      - resvg
      - imagemagick

# yazi's search runs `fd`, but Debian ships it as `fdfind` (fd-find, from tmux.yaml).
- name: link fd to fdfind
  file:
    src: /usr/bin/fdfind
    path: ~/.local/bin/fd
    state: link
    force: true

# Rose Pine flavor is vendored in files/yazi so it can be tweaked over time.
- name: link yazi config
  file:
    src: "{{ role_path }}/files/yazi"
    path: ~/.config/yazi
    state: link
    force: true
