---

# hypridle dims the backlight to 10 when idle, and if the machine is shut down
# while dimmed, systemd-backlight saves that value and restores it on next boot,
# leaving the tty nearly black. Force a sane brightness after the restore runs.
- name: Install boot brightness service
  tags: brightness
  become: true
  copy:
    src: etc/systemd/system/boot-brightness.service
    dest: /etc/systemd/system/boot-brightness.service
    owner: root
    group: root
    mode: '0644'

- name: Enable boot brightness service
  tags: brightness
  become: true
  systemd:
    name: boot-brightness.service
    enabled: true
    daemon_reload: true
