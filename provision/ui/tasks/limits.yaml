---

# Debian's systemd ships a default *soft* nofile limit of 1024 (hard is already
# 524288), so most desktop-session processes (portal daemons, hyprpolkitagent,
# glycin's sandboxed image loaders) inherit that low cap. Heavy Unix-socket
# fd-passing traffic from apps like Slack/Chrome/Discord (D-Bus, PipeWire,
# clipboard, tray icons) can push the system-wide in-flight fd count past that
# cap, causing other processes to fail their next fd-passing call with
# ETOOMANYREFS ("Too many references: cannot splice") - surfaced by glycin as
# a generic zbus i/o error. Raise the default soft limit to match the existing
# hard ceiling so this doesn't happen.
#
# NOTE: this requires a full logout/login (new Hyprland session) to take
# effect - systemd --user reads DefaultLimitNOFILE at its own startup.
- name: Ensure /etc/systemd/user.conf.d exists
  tags: limits
  become: true
  file:
    path: /etc/systemd/user.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Raise default systemd user-session file descriptor limit
  tags: limits
  become: true
  copy:
    src: etc/systemd/user.conf.d/50-nofile-limits.conf
    dest: /etc/systemd/user.conf.d/50-nofile-limits.conf
    owner: root
    group: root
    mode: '0644'

# The above only covers units systemd --user itself spawns (D-Bus-activated
# services like xdg-desktop-portal-gtk). This session is a plain `login`(1)
# TTY session (start-hyprland -> Hyprland -> everything else), not a
# systemd-managed graphical session, so the actual process tree - Hyprland
# itself, quickshell, hypridle/hyprpaper, terminals, and every Electron app
# (Slack/Chrome/Discord) - inherits its nofile limit from `login`, which goes
# through PAM (`session required pam_limits.so` in /etc/pam.d/login). Without
# an explicit entry here, that stays at the kernel default of 1024 soft
# regardless of the systemd drop-in above. This is the drop-in that actually
# reaches that tree.
#
# NOTE: also requires a full logout/login to take effect - pam_limits only
# applies limits at session start.
- name: Raise default PAM session file descriptor limit
  tags: limits
  become: true
  copy:
    src: etc/security/limits.d/50-nofile-limits.conf
    dest: /etc/security/limits.d/50-nofile-limits.conf
    owner: root
    group: root
    mode: '0644'
