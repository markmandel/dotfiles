# fnm (Fast Node Manager) installs official Node.js builds in the home directory.
# Debian's nodejs is built without TypeScript type-stripping, which some tools need.
# The system nodejs (npm.yaml) stays as the default `node`: no shell integration is
# set up here, and each project installs the Node versions it needs with fnm.
#
# Re-running this upgrades fnm to its latest release.

---
- name: Install or upgrade fnm
  shell: curl -fsSL https://fnm.vercel.app/install | bash -s -- --skip-shell --install-dir ~/.local/share/fnm
  args:
    executable: /bin/bash

- name: Create ~/.local/bin
  file:
    path: ~/.local/bin
    state: directory

- name: Link fnm into ~/.local/bin
  file:
    src: ~/.local/share/fnm/fnm
    dest: ~/.local/bin/fnm
    state: link
