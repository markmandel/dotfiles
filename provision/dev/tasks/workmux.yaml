- name: install or update workmux
  shell: |
    WORKMUX_INSTALL_DIR="$HOME/.local/bin" \
      curl -fsSL https://raw.githubusercontent.com/raine/workmux/main/scripts/install.sh | bash
  retries: 5
  delay: 5

# `workmux setup` requires an interactive terminal, so install the status
# tracking hooks via the Claude Code plugin instead - workmux recognises an
# enabled workmux-status plugin as configured.
- name: add workmux claude code marketplace
  shell: claude plugin marketplace add raine/workmux
  ignore_errors: true
  retries: 5
  delay: 5

- name: install workmux status tracking plugin
  shell: claude plugin install workmux-status@workmux -y
  ignore_errors: true

- name: create workmux claude skill dirs
  file:
    path: "~/.claude/skills/{{ item }}"
    state: directory
    mode: '0755'
  loop: &workmux_skills
    - merge
    - rebase
    - worktree
    - coordinator
    - open-pr
    - workmux

- name: install workmux claude skills
  get_url:
    url: "https://raw.githubusercontent.com/raine/workmux/main/skills/{{ item }}/SKILL.md"
    dest: "~/.claude/skills/{{ item }}/SKILL.md"
    force: true
    mode: '0644'
  loop: *workmux_skills
  retries: 5
  delay: 5
