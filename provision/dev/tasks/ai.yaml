- name: Install Claude Code CLI
  shell: curl -fsSL https://claude.ai/install.sh | bash
  retries: 5
  delay: 5

# Both add and install succeed if already present, but install doesn't upgrade,
# so refresh the marketplace and update the plugin on every run.
# The status line itself is set up once with the plugin's /claude-hud:hud skill.
- name: Add claude-hud plugin marketplace
  shell: ~/.local/bin/claude plugin marketplace add jarrodwatts/claude-hud

- name: Install claude-hud plugin
  shell: ~/.local/bin/claude plugin install claude-hud@claude-hud

- name: Update claude-hud plugin marketplace
  shell: ~/.local/bin/claude plugin marketplace update claude-hud

- name: Update claude-hud plugin
  shell: ~/.local/bin/claude plugin update claude-hud@claude-hud

- name: Ensure ~/.claude/skills exists
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/skills"
    state: directory

# If a skill already exists as a real directory, remove it manually first -
# Ansible won't replace a non-empty directory with a symlink.
- name: Symlink Claude skills into ~/.claude/skills
  file:
    src: "{{ role_path }}/files/claude/skills/{{ item }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/skills/{{ item }}"
    state: link
    force: true
  with_items: "{{ lookup('pipe', 'find ' + role_path + '/files/claude/skills -mindepth 1 -maxdepth 1 -type d -printf \"%f\\n\"').splitlines() }}"

- name: Ensure ~/.local/bin exists
  file:
    path: ~/.local/bin
    state: directory
    mode: '0755'

- name: Download latest Antigravity CLI
  shell:
    chdir: /tmp
    cmd: >
      curl -s https://api.github.com/repos/google-antigravity/antigravity-cli/releases/latest
      | jq -r '.assets[] | select(.name == "agy_cli_linux_x64.tar.gz") | .browser_download_url'
      | xargs -I{} curl -fsSL -o /tmp/agy_cli.tar.gz {}
  retries: 5
  delay: 5

- name: Extract Antigravity CLI to ~/.local/bin
  unarchive:
    src: /tmp/agy_cli.tar.gz
    dest: ~/.local/bin
    remote_src: yes

- name: Run antigravity install
  shell: ~/.local/bin/antigravity install --skip-path